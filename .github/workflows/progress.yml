name: Cập nhật tiến độ

# Mỗi khi docs/TASKS.md đổi, tính lại bảng tiến độ và ghi vào README.md.
on:
  push:
    branches: [main, dev]
    paths:
      - "docs/TASKS.md"
      - "tools/update_progress.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tính tiến độ
        run: python tools/update_progress.py

      - name: Commit nếu có thay đổi
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: cap nhat tien do TASKS [skip ci]"
            git push
          else
            echo "README.md khong doi"
          fi
